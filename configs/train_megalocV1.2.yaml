# same as V 1.1 but 15k steps
training:
  # null consumes the complete schedule (4 steps in the snapshot, 40,000 in the full dataset).
  iterations: 20000
  seed: 42
  grad_cache_chunk_size: 32
  checkpoint_every_n_steps: 1000

augmentation:
  image_size: [256, 256]
  randaugment_ops: 3

model:
  backbone: dinov3_vitb16
  backbone_weights: facebook/dinov3-vitb16-pretrain-lvd1689m
  trainable_blocks: 4
  num_clusters: 64
  cluster_dim: 256
  token_dim: 256
  output_dim: 8448

optimizer:
  name: adamw
  learning_rate: 6.0e-5
  weight_decay: 9.5e-9

scheduler:
  name: linear
  end_factor: 0.2

loss:
  name: MultiSimilarityLoss
  miner: MultiSimilarityMiner
  miner_margin: 0.1
