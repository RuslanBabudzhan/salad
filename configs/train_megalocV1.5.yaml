# MegaLoc architecture: DINOv2 ViT-B/14 + SALAD.
training:
  iterations: null
  seed: 42
  grad_cache_chunk_size: 32
  checkpoint_every_n_steps: 1000

augmentation:
  image_size: [224, 224]
  randaugment_ops: 3
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]

model:
  backbone: dinov2_vitb14
  trainable_blocks: 4
  num_clusters: 64
  cluster_dim: 256
  token_dim: 256
  output_dim: 8448

optimizer:
  name: adamw
  learning_rate: 6.0e-5
  weight_decay: 9.5e-9

scheduler:
  name: linear
  end_factor: 0.2

loss:
  name: MultiSimilarityLoss
  miner: MultiSimilarityMiner
  miner_margin: 0.1
