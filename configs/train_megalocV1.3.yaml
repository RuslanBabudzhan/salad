# DINOv3 ViT-L/16 pretrained on SAT-493M.
training:
  iterations: 20000
  seed: 42
  grad_cache_chunk_size: 16
  checkpoint_every_n_steps: 1000

augmentation:
  image_size: [256, 256]
  randaugment_ops: 3
  image_mean: [0.430, 0.411, 0.296]
  image_std: [0.213, 0.156, 0.143]

model:
  backbone: dinov3_vitl16
  backbone_weights: facebook/dinov3-vitl16-pretrain-sat493m
  trainable_blocks: 4
  num_clusters: 64
  cluster_dim: 256
  token_dim: 256
  output_dim: 8448

optimizer:
  name: adamw
  learning_rate: 6.0e-5
  weight_decay: 9.5e-9

scheduler:
  name: linear
  end_factor: 0.2

loss:
  name: MultiSimilarityLoss
  miner: MultiSimilarityMiner
  miner_margin: 0.1
